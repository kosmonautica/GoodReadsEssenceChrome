<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>GoodReads Essence</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 420px; margin: 12px; }
    textarea { width: 100%; height: 280px; box-sizing: border-box; font: 12px ui-monospace, monospace; }
    button { margin-top: 8px; padding: 6px 12px; }
    #status { margin-left: 8px; color: #2a7; }
    #message { color: #b33; }
  </style>
</head>
<body>
  <p id="message" hidden></p>
  <div id="preview" hidden>
    <textarea id="output"></textarea>
    <button id="copy">Copy to clipboard</button> <button id="copyCover" title="Copies text and the downloaded cover image">Copy with cover image</button><span id="status"></span>
  </div>
  <p><a href="#" id="settings">Settings</a></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
